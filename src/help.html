<dialog id="welcomeDialog" aria-labelledby="welcomeTitle">
 <div class="help-kicker">✦ <span>开始探索</span></div>
 <h2 id="welcomeTitle">欢迎来到星轨</h2>
 <p>第一次来，可以跟着简易导览边看边试。想查某项功能，打开详细手册。</p>
 <p class="help-night">画面很暗？空间站可能正飞过夜晚的海面。等它飞到阳光下，或把轨道时间轴拖到金色的日照段。</p>
 <div class="help-welcome-actions"><button id="startTour" type="button" class="primary">简易导览</button><button id="welcomeManual" type="button">详细手册</button><button id="skipTour" type="button">直接开始</button></div>
 <p class="small">右上角可打开帮助。窄屏先点「工具」。</p>
</dialog>
<svg id="helpSpotlight" aria-hidden="true" hidden><defs><marker id="helpArrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#a6f1ff" stroke-width="1.5"/></marker></defs><path id="helpShade" fill-rule="evenodd"/><rect id="helpRing" rx="9"/><path id="helpArrow" marker-end="url(#helpArrowHead)"/></svg>
<section id="helpPanel" role="dialog" aria-labelledby="helpTitle" tabindex="-1" hidden>
 <div class="help-heading-row"><div class="help-heading"><span id="helpProgress" class="help-kicker"></span><h2 id="helpTitle"></h2></div><button id="closeHelp" type="button" aria-label="关闭帮助">×</button></div>
 <div class="help-links"><button id="helpDirectory" type="button"></button><button id="helpSwitch" type="button"></button></div>
 <div id="helpContents"></div>
 <div id="tourActions"><button id="tourPrevious" type="button">上一页</button><button id="tourNext" type="button" class="primary">下一页</button></div>
</section>
