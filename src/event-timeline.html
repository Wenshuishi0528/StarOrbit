<div id="eventTimeline" aria-label="轨道事件时间轴">
 <div class="event-heading"><button id="toggleEventTimeline" aria-expanded="true">收起时间轴</button><span id="nextEventSummary"></span><button id="previousOrbitEvent" title="上一个事件" aria-label="上一个事件">‹</button><button id="nextOrbitEvent" title="下一个事件" aria-label="下一个事件">›</button></div>
 <div id="eventRail" role="slider" tabindex="0" aria-label="轨道事件时间轴" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><div id="eventBands"></div><div id="eventMarkers"></div><i id="eventCursor"></i></div>
 <div id="eventScale" aria-hidden="true"></div>
 <div id="orbitEventDetail" hidden><div class="event-detail-heading"><select id="orbitEventChoice" aria-label="选择轨道事件"></select><button id="closeOrbitEvent" aria-label="关闭事件详情">×</button></div><p id="orbitEventTime"></p><button id="watchOrbitEvent">观看此事件</button><span class="event-watch-hint">提前 30 秒，以 1× 播放</span></div>
</div>
